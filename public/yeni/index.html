<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2a120c">
<meta name="robots" content="noindex,nofollow">
<title>Ergenekon: Demir Dağ</title>
<script>
/* Giriş kapısı: kodda yalnız şifrenin SHA-256 özeti bulunur. Eski oyunla aynı 'eg_gate' anahtarını kullanır. */
(function(){
  var H='056781971c20e84caa8a085010df91253db88c1b525680cfe59b5648982204ab';
  try{if(localStorage.getItem('eg_gate')===H){document.documentElement.className='acik';return}}catch(e){}
  document.documentElement.className='kilitli';
  window.__gate=function(){
    var f=document.getElementById('kapi');if(!f)return;f.hidden=false;var i=f.querySelector('input'),m=f.querySelector('p');
    f.addEventListener('submit',function(ev){ev.preventDefault();
      if(!window.crypto||!crypto.subtle){m.textContent='Bu tarayıcı desteklenmiyor.';return}
      crypto.subtle.digest('SHA-256',new TextEncoder().encode(i.value.trim())).then(function(b){
        var x=Array.prototype.map.call(new Uint8Array(b),function(v){return('0'+v.toString(16)).slice(-2)}).join('');
        if(x===H){try{localStorage.setItem('eg_gate',H)}catch(e){}document.documentElement.className='acik';f.remove();if(window.__go)window.__go()}
        else{m.textContent='Şifre yanlış.';i.value='';i.focus()}
      });
    });
    setTimeout(function(){try{i.focus()}catch(e){}},60);
  };
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Alegreya+Sans:wght@500;700;800&display=swap" rel="stylesheet">

</head>
<body>
<form id="kapi" hidden autocomplete="on"><small>ERGENEKON · DEMİR DAĞ</small><h1>Oba Kapısı</h1><input type="password" inputmode="numeric" autocomplete="current-password" placeholder="Şifre" aria-label="Oyun şifresi" required><button>Gir</button><p></p></form>
<div id="oyun"></div>

<script src="../whiteout-research-data.js?v=1"></script>

<script src="gorsel.js?v=1"></script>
<script src="arayuz.js?v=1"></script>
<script src="ekranlar.js?v=1"></script>
<script>
(function(){function go(){E.boot(function(){UI.start()})}
if(document.documentElement.className==='acik')go();else{window.__go=go;window.__gate()}})();
</script>
</body>
</html>
